trigger: none

# Scheduled runs are paused while we root-cause an ongoing issue.
# Do not remove this pipeline; re-enable by uncommenting the schedule below.
# schedules:
# - cron: "0 5 * * *"
#   displayName: Mon through Sun at 9:00 PM (UTC-8:00)
#   branches:
#     include:
#     - main
#   always: true

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - template: /eng/pipelines/coreclr/templates/gc-validation/gc-standalone-stages.yml
      parameters:
        enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}
