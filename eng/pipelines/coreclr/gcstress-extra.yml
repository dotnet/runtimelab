trigger: none

schedules:
- cron: "0 21 * * 6,0"
  displayName: Sat and Sun at 1:00 PM (UTC-8:00)
  branches:
    include:
    - main
  always: true

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - template: /eng/pipelines/coreclr/templates/gc-validation/gcstress-extra-stages.yml
      parameters:
        enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}
