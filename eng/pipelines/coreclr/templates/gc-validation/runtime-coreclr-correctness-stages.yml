parameters:
- name: enableHelixJobMonitor
  type: string
- name: dependsOn
  type: object
  default: []
- name: helixMonitorDependsOn
  type: object
  default: []
- name: helixMonitorCondition
  type: string
  default: ''

stages:
- stage: Build
  dependsOn: ${{ parameters.dependsOn }}
  jobs:
  - ${{ if eq(parameters.enableHelixJobMonitor, 'true') }}:
    - template: /eng/common/core-templates/job/helix-job-monitor.yml
      parameters:
        helixAccessToken: $(HelixApiAccessToken)
        timeoutInMinutes: 720
        allowNoHelixJobs: true
        dependsOn: ${{ parameters.helixMonitorDependsOn }}
        condition: ${{ parameters.helixMonitorCondition }}

  # Definition 129 authority producer for the browser CoreCLR test executions.
  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      buildConfig: checked
      platforms:
      - browser_wasm
      jobParameters:
        nameSuffix: CoreCLR_ReleaseLibraries
        buildArgs: -s clr+libs+libs.tests+packs -c Release -rc $(_BuildConfig) /p:TestAssemblies=false /p:ArchiveTests=true /p:InstallWorkloadForTesting=false
        timeoutInMinutes: 120
        postBuildSteps:
          - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
            parameters:
              extraBuildArgs: -os browser
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
              displayName: Build Assets
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/helix
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: CoreCLR_ReleaseLibraries_TestArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
          - template: /eng/pipelines/common/wasm-post-build-steps.yml
            parameters:
              publishArtifactsForWorkload: true
              publishWBT: true
        extraVariablesTemplates:
          - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
            parameters:
              testGroup: innerloop
              liveLibrariesBuildConfig: Release
          - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
            parameters:
              testGroup: innerloop
        condition: >-
          or(
            eq(variables['wasmDarcDependenciesChanged'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  # Definition 129 authority producers for checked CoreCLR and Release libraries.
  # The unrelated libraries Helix post-build leg is intentionally omitted.
  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      buildConfig: Release
      platforms:
      - linux_arm64
      - osx_arm64
      jobParameters:
        nameSuffix: Libraries_CheckedCoreCLR
        buildArgs: -s clr+libs+libs.tests -c $(_BuildConfig) -rc Checked /p:ArchiveTests=true
        timeoutInMinutes: 120
        preBuildSteps:
          - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
        postBuildSteps:
          - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
          - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
              displayName: Build Assets
        extraVariablesTemplates:
          - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
            parameters:
              testGroup: innerloop
              configOverride: Checked
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_libraries.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      buildConfig: Release
      platforms:
      - linux_x64
      - windows_x64
      jobParameters:
        nameSuffix: Libraries_CheckedCoreCLR
        buildArgs: -s clr+clr.wasmjit+libs -c $(_BuildConfig) -rc Checked
        timeoutInMinutes: 120
        preBuildSteps:
          - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
        postBuildSteps:
          - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
          - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
              displayName: Build Assets
        extraVariablesTemplates:
          - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
            parameters:
              testGroup: innerloop
              configOverride: Checked
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      buildConfig: Release
      platforms:
      - osx_x64
      jobParameters:
        nameSuffix: Libraries_CheckedCoreCLR
        buildArgs: -s clr+libs -c $(_BuildConfig) -rc Checked
        timeoutInMinutes: 120
        preBuildSteps:
          - template: /eng/pipelines/coreclr/templates/setup-sccache.yml
        postBuildSteps:
          - template: /eng/pipelines/coreclr/templates/sccache-stats.yml
          - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
              displayName: Build Assets
        extraVariablesTemplates:
          - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
            parameters:
              testGroup: innerloop
              configOverride: Checked
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/global-build-job.yml
      buildConfig: checked
      platforms:
      - linux_arm
      - windows_arm64
      - windows_x86
      jobParameters:
        nameSuffix: CoreCLR_ReleaseLibraries
        buildArgs: -s clr+libs -rc $(_BuildConfig) -c Release
        timeoutInMinutes: 120
        postBuildSteps:
          - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
          - template: /eng/pipelines/common/upload-artifact-step.yml
            parameters:
              rootFolder: $(Build.SourcesDirectory)/artifacts/bin
              includeRootFolder: false
              archiveType: $(archiveType)
              archiveExtension: $(archiveExtension)
              tarCompression: $(tarCompression)
              artifactName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
              displayName: Build Assets
        extraVariablesTemplates:
          - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
            parameters:
              testGroup: innerloop
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  # Definition 129 authority WASI CoreCLR runtime-test leg.
  - template: /eng/pipelines/common/templates/wasi-wasm-coreclr-runtime-tests.yml
    parameters:
      platforms:
      - wasi_wasm
      alwaysRun: ${{ variables.isRollingBuild }}
      useHelixMonitor: ${{ parameters.enableHelixJobMonitor }}

  # Definition 129 authority common managed test build.
  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/templates/runtimes/build-test-job.yml
      buildConfig: checked
      platforms:
      - CoreClrTestBuildHost
      jobParameters:
        testGroup: innerloop
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  # Definition 129 authority CoreCLR runtime-test executions.
  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/templates/runtimes/run-test-job.yml
      buildConfig: checked
      platforms:
      - linux_arm
      - windows_x86
      - windows_arm64
      helixQueueGroup: pr
      helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
      jobParameters:
        testGroup: innerloop
        liveLibrariesBuildConfig: Release
        unifiedArtifactsName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
        unifiedBuildNameSuffix: CoreCLR_ReleaseLibraries
        useHelixMonitor: ${{ parameters.enableHelixJobMonitor }}
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/templates/runtimes/run-test-job.yml
      buildConfig: checked
      platforms:
      - browser_wasm
      helixQueueGroup: pr
      helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
      jobParameters:
        testGroup: innerloop
        liveLibrariesBuildConfig: Release
        unifiedArtifactsName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
        unifiedBuildNameSuffix: CoreCLR_ReleaseLibraries
        useHelixMonitor: ${{ parameters.enableHelixJobMonitor }}
        extraBuildArgs: -os browser -p:HostConfiguration=Release
        condition: >-
          or(
            eq(variables['wasmDarcDependenciesChanged'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/templates/runtimes/run-test-job.yml
      buildConfig: checked
      platforms:
      - browser_wasm
      helixQueueGroup: pr
      helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
      jobParameters:
        testGroup: innerloop
        readyToRun: true
        displayNameArgs: R2R_CG2
        liveLibrariesBuildConfig: Release
        unifiedArtifactsName: CoreCLR_ReleaseLibraries_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_hostedOs)_$(_BuildConfig)
        unifiedBuildNameSuffix: CoreCLR_ReleaseLibraries
        useHelixMonitor: ${{ parameters.enableHelixJobMonitor }}
        extraBuildArgs: -os browser -p:HostConfiguration=Release
        condition: >-
          or(
            eq(variables['wasmDarcDependenciesChanged'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_tools_illink.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_wasm_coreclr_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))

  - template: /eng/pipelines/common/platform-matrix.yml
    parameters:
      jobTemplate: /eng/pipelines/common/templates/runtimes/run-test-job.yml
      buildConfig: checked
      platforms:
      - osx_arm64
      - osx_x64
      - linux_x64
      - linux_arm64
      - windows_x64
      helixQueueGroup: pr
      helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
      jobParameters:
        testGroup: innerloop
        liveLibrariesBuildConfig: Release
        unifiedArtifactsName: Libraries_CheckedCoreCLR_BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_Release
        unifiedBuildNameSuffix: Libraries_CheckedCoreCLR
        unifiedBuildConfigOverride: Release
        useHelixMonitor: ${{ parameters.enableHelixJobMonitor }}
        condition: >-
          or(
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_coreclr.containsChange'], true),
            eq(stageDependencies.EvaluatePaths.evaluate_paths.outputs['SetPathVars_runtimetests.containsChange'], true),
            eq(variables['isRollingBuild'], true))
