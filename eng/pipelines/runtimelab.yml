# This baseline is reviewed before any CI is requested.
parameters:
- name: gcValidationMode
  displayName: GC validation mode
  type: string
  default: baseline
  values:
  - baseline
  - correctness-stress
  - correctness-shard
- name: gcValidationRoot
  displayName: GC validation root
  type: string
  default: gcstress0x3-gcstress0xc
  values:
  - gcstress0x3-gcstress0xc
  - gcstress-extra
  - gc-longrunning
  - gc-simulator
  - gc-standalone

trigger: none
pr: none

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml
  - ${{ if and(ne(variables['System.TeamProject'], 'public'), ne(variables['Build.Reason'], 'PullRequest')) }}:
    - name: TeamName
      value: dotnet-core

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - ${{ if eq(parameters.gcValidationMode, 'baseline') }}:
      - stage: Build
        jobs:
          - ${{ if eq(variables['enableHelixJobMonitor'], true) }}:
            - template: /eng/common/core-templates/job/helix-job-monitor.yml
              parameters:
                helixAccessToken: $(HelixApiAccessToken)
                timeoutInMinutes: 540
                allowNoHelixJobs: true

          #
          # Build the whole product with Checked CoreCLR and run runtime tests
          #
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
              buildConfig: checked
              platforms:
              - linux_x64
              - windows_x64
              jobParameters:
                timeoutInMinutes: 200
                buildArgs: -s clr+libs+clr.hosts+packs -c debug -rc $(_BuildConfig)
                postBuildSteps:
                  - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                    parameters:
                      creator: dotnet-bot
                      testRunNamePrefixSuffix: CoreCLR_$(_BuildConfig)
                      useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml

          #
          # Build the whole product with Release CoreCLR and run libraries tests
          #
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
              buildConfig: release
              platforms:
              - linux_x64
              - windows_x64
              jobParameters:
                timeoutInMinutes: 180
                buildArgs: -s clr+libs+libs.tests+clr.hosts+packs -c $(_BuildConfig) /p:ArchiveTests=true
                postBuildSteps:
                  - template: /eng/pipelines/libraries/helix.yml
                    parameters:
                      creator: dotnet-bot
                      testRunNamePrefixSuffix: Libraries_$(_BuildConfig)
                      useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml

          #
          # Build and test libraries AllConfigurations
          #
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
              platforms:
              - windows_x64
              jobParameters:
                buildArgs: -test -s tools+libs+libs.tests -c $(_BuildConfig) /p:BuildAllConfigurations=true /p:TestAssemblies=false /p:TestPackages=true
                nameSuffix: Libraries_AllConfigurations
                timeoutInMinutes: 150
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml

    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gcstress0x3-gcstress0xc')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gcstress0x3-gcstress0xc-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gcstress-extra')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gcstress-extra-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gc-longrunning')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gc-longrunning-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gc-simulator')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gc-simulator-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gc-standalone')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gc-standalone-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ eq(variables['enableHelixJobMonitor'], true) }}

    # Definition 163's project-scoped build identity does not currently have
    # Queue builds permission, so parent orchestration must fail closed.
    - ${{ if eq(parameters.gcValidationMode, 'correctness-stress') }}:
      - gcValidationCorrectnessStressRequiresQueueBuildPermission: error
