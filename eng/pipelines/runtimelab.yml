# This baseline is reviewed before any CI is requested.
parameters:
- name: gcValidationMode
  displayName: GC validation mode
  type: string
  default: baseline
  values:
  - baseline
  - correctness-stress
  - correctness-shard
- name: gcValidationRoot
  displayName: GC validation root
  type: string
  default: gcstress0x3-gcstress0xc
  values:
  - gcstress0x3-gcstress0xc
  - gcstress-extra
  - gc-longrunning
  - gc-simulator
  - gc-standalone
  - runtime-coreclr-correctness
  - crossgen2-composite-gcstress
- name: gcValidationCampaignId
  displayName: GC validation campaign ID
  type: string
  default: ''
- name: gcValidationRunKind
  displayName: GC validation run kind
  type: string
  default: direct
  values:
  - direct
  - parent-child
- name: gcValidationParentBuildId
  displayName: GC validation parent build ID
  type: string
  default: direct
- name: gcValidationAttempt
  displayName: GC validation shard attempt
  type: number
  default: 1
  values:
  - 1
  - 2

trigger: none
pr: none

variables:
  - template: /eng/pipelines/common/variables.yml
  - name: enableHelixJobMonitor
    value: true
  - template: /eng/pipelines/helix-platforms.yml
  - ${{ if and(ne(variables['System.TeamProject'], 'public'), ne(variables['Build.Reason'], 'PullRequest')) }}:
    - name: TeamName
      value: dotnet-core

extends:
  template:  /eng/pipelines/common/templates/pipeline-with-resources.yml
  parameters:
    stages:
    - ${{ if eq(parameters.gcValidationMode, 'baseline') }}:
      - stage: Build
        jobs:
          - ${{ if eq(variables['enableHelixJobMonitor'], true) }}:
            - template: /eng/common/core-templates/job/helix-job-monitor.yml
              parameters:
                helixAccessToken: $(HelixApiAccessToken)
                timeoutInMinutes: 540
                allowNoHelixJobs: true

          #
          # Build the whole product with Checked CoreCLR and run runtime tests
          #
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
              buildConfig: checked
              platforms:
              - linux_x64
              - windows_x64
              jobParameters:
                timeoutInMinutes: 200
                buildArgs: -s clr+libs+clr.hosts+packs -c debug -rc $(_BuildConfig)
                postBuildSteps:
                  - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                    parameters:
                      creator: dotnet-bot
                      testRunNamePrefixSuffix: CoreCLR_$(_BuildConfig)
                      useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml

          #
          # Build the whole product with Release CoreCLR and run libraries tests
          #
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
              buildConfig: release
              platforms:
              - linux_x64
              - windows_x64
              jobParameters:
                timeoutInMinutes: 180
                buildArgs: -s clr+libs+libs.tests+clr.hosts+packs -c $(_BuildConfig) /p:ArchiveTests=true
                postBuildSteps:
                  - template: /eng/pipelines/libraries/helix.yml
                    parameters:
                      creator: dotnet-bot
                      testRunNamePrefixSuffix: Libraries_$(_BuildConfig)
                      useHelixMonitor: ${{ variables.enableHelixJobMonitor }}
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml

          #
          # Build and test libraries AllConfigurations
          #
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              buildConfig: ${{ variables.debugOnPrReleaseOnRolling }}
              platforms:
              - windows_x64
              jobParameters:
                buildArgs: -test -s tools+libs+libs.tests -c $(_BuildConfig) /p:BuildAllConfigurations=true /p:TestAssemblies=false /p:TestPackages=true
                nameSuffix: Libraries_AllConfigurations
                timeoutInMinutes: 150
                extraVariablesTemplates:
                  - template: /eng/pipelines/common/templates/runtimes/test-variables.yml

    - ${{ if eq(parameters.gcValidationMode, 'correctness-shard') }}:
      - stage: GCValidationAdmission
        displayName: Admit canonical GC validation shard
        jobs:
        - job: AdmitCanonicalGcValidationShard
          displayName: Admit canonical GC validation shard
          timeoutInMinutes: 10
          pool:
            name: $(DncEngPublicBuildPool)
            os: linux
            demands: ImageOverride -equals build.azurelinux.3.amd64.open
          steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              python3 '$(Build.SourcesDirectory)/eng/pipelines/runtimelab/orchestrate_gc_validation.py' \
                --emit-run-identity-tags \
                --run-kind "$GC_VALIDATION_RUN_KIND" \
                --campaign-id "$GC_VALIDATION_CAMPAIGN_ID" \
                --parent-build-id "$GC_VALIDATION_PARENT_BUILD_ID" \
                --root "$GC_VALIDATION_ROOT" \
                --attempt "$GC_VALIDATION_ATTEMPT"
            displayName: Publish GC validation run identity
            env:
              GC_VALIDATION_RUN_KIND: ${{ parameters.gcValidationRunKind }}
              GC_VALIDATION_CAMPAIGN_ID: ${{ parameters.gcValidationCampaignId }}
              GC_VALIDATION_PARENT_BUILD_ID: ${{ parameters.gcValidationParentBuildId }}
              GC_VALIDATION_ROOT: ${{ parameters.gcValidationRoot }}
              GC_VALIDATION_ATTEMPT: ${{ parameters.gcValidationAttempt }}

          - bash: |
              set -euo pipefail

              python3 '$(Build.SourcesDirectory)/eng/pipelines/runtimelab/orchestrate_gc_validation.py' \
                --admit-child \
                --output-directory '$(Build.ArtifactStagingDirectory)/gc-validation-admission' \
                --run-kind "$GC_VALIDATION_RUN_KIND" \
                --campaign-id "$GC_VALIDATION_CAMPAIGN_ID" \
                --parent-build-id "$GC_VALIDATION_PARENT_BUILD_ID" \
                --root "$GC_VALIDATION_ROOT" \
                --attempt "$GC_VALIDATION_ATTEMPT"
            displayName: Admit canonical child run
            env:
              GC_VALIDATION_RUN_KIND: ${{ parameters.gcValidationRunKind }}
              GC_VALIDATION_CAMPAIGN_ID: ${{ parameters.gcValidationCampaignId }}
              GC_VALIDATION_PARENT_BUILD_ID: ${{ parameters.gcValidationParentBuildId }}
              GC_VALIDATION_ROOT: ${{ parameters.gcValidationRoot }}
              GC_VALIDATION_ATTEMPT: ${{ parameters.gcValidationAttempt }}
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: PublishPipelineArtifact@1
            displayName: Publish GC validation admission receipt
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/gc-validation-admission
              artifactName: GCValidationAdmission_$(Build.BuildId)

    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gcstress0x3-gcstress0xc')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gcstress0x3-gcstress0xc-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - run_test_p1__linux_arm_checked
          - run_test_p1__linux_arm64_checked
          - run_test_p1__linux_x64_checked
          - run_test_p1__osx_arm64_checked
          - run_test_p1__windows_x64_checked
          - run_test_p1__windows_x86_checked
          - run_test_p1__windows_arm64_checked
          helixMonitorCondition: succeededOrFailed()
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gcstress-extra')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gcstress-extra-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - run_test_p1__linux_arm_checked
          - run_test_p1__linux_arm64_checked
          - run_test_p1__linux_x64_checked
          - run_test_p1__osx_arm64_checked
          - run_test_p1__windows_x64_checked
          - run_test_p1__windows_x86_checked
          - run_test_p1__windows_arm64_checked
          helixMonitorCondition: succeededOrFailed()
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gc-longrunning')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gc-longrunning-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - run_test_p1__linux_arm64_release
          - run_test_p1__linux_x64_release
          - run_test_p1__windows_x64_release
          - run_test_p1__windows_arm64_release
          helixMonitorCondition: succeededOrFailed()
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gc-simulator')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gc-simulator-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - run_test_p1__linux_arm64_release
          - run_test_p1__windows_x64_release
          - run_test_p1__windows_arm64_release
          helixMonitorCondition: succeededOrFailed()
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'gc-standalone')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/gc-standalone-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - run_test_p1_GCStandAlone_linux_arm64_checked
          - run_test_p1_GCStandAlone_linux_x64_checked
          - run_test_p1_GCStandAlone_windows_x64_checked
          - run_test_p1_GCStandAlone_windows_arm64_checked
          - run_test_p1_GCStandAloneServer_linux_arm64_checked
          - run_test_p1_GCStandAloneServer_linux_x64_checked
          - run_test_p1_GCStandAloneServer_windows_x64_checked
          - run_test_p1_GCStandAloneServer_windows_arm64_checked
          helixMonitorCondition: succeededOrFailed()
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'runtime-coreclr-correctness')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/runtime-coreclr-correctness-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - build_wasi_wasm_linux_Release_CoreCLR_WASI_RuntimeTests
          - run_test_p0_coreclr__linux_arm_checked
          - run_test_p0_coreclr__windows_x86_checked
          - run_test_p0_coreclr__windows_arm64_checked
          - run_test_p0_coreclr__browser_wasm_checked
          - run_test_p0_coreclr_R2R_CG2_browser_wasm_checked
          - run_test_p0_coreclr__linux_arm64_checked
          - run_test_p0_coreclr__linux_x64_checked
          - run_test_p0_coreclr__osx_arm64_checked
          - run_test_p0_coreclr__osx_x64_checked
          - run_test_p0_coreclr__windows_x64_checked
          helixMonitorCondition: succeededOrFailed()
    - ${{ if and(eq(parameters.gcValidationMode, 'correctness-shard'), eq(parameters.gcValidationRoot, 'crossgen2-composite-gcstress')) }}:
      - template: /eng/pipelines/coreclr/templates/gc-validation/crossgen2-composite-gcstress-stages.yml
        parameters:
          enableHelixJobMonitor: ${{ variables.enableHelixJobMonitor }}
          dependsOn:
          - GCValidationAdmission
          helixMonitorDependsOn:
          - run_test_p1_Composite_linux_arm64_checked
          - run_test_p1_Composite_linux_x64_checked
          - run_test_p1_Composite_osx_arm64_checked
          - run_test_p1_Composite_windows_x64_checked
          - run_test_p1_Composite_windows_arm64_checked
          helixMonitorCondition: succeededOrFailed()

    - ${{ if eq(parameters.gcValidationMode, 'correctness-stress') }}:
      - stage: GCValidationCorrectnessStress
        displayName: GC correctness and stress validation
        jobs:
        - job: QueueAndMonitorGcValidationShards
          displayName: Queue and monitor GC validation shards
          timeoutInMinutes: 1440
          pool:
            name: $(DncEngPublicBuildPool)
            os: linux
            demands: ImageOverride -equals build.azurelinux.3.amd64.open
          steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -uo pipefail

              receiptDirectory='$(Build.ArtifactStagingDirectory)/gc-validation-children'
              mkdir -p "$receiptDirectory"
              python3 '$(Build.SourcesDirectory)/eng/pipelines/runtimelab/orchestrate_gc_validation.py' \
                --output-directory "$receiptDirectory" \
                --campaign-id "$GC_VALIDATION_CAMPAIGN_ID" \
                --parent-build-id "$GC_VALIDATION_PARENT_BUILD_ID" \
                --monitor-timeout-minutes 1380
              orchestrationStatus=$?
              printf '%s\n' "$orchestrationStatus" > "$receiptDirectory/orchestration-exit-code.txt"
              exit 0
            displayName: Queue and monitor child runs
            env:
              GC_VALIDATION_CAMPAIGN_ID: ${{ parameters.gcValidationCampaignId }}
              GC_VALIDATION_PARENT_BUILD_ID: $(Build.BuildId)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: PublishPipelineArtifact@1
            displayName: Publish GC validation child receipts
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/gc-validation-children
              artifactName: GCValidationChildren_$(Build.BuildId)

          - bash: |
              receiptDirectory='$(Build.ArtifactStagingDirectory)/gc-validation-children'
              statusFile="$receiptDirectory/orchestration-exit-code.txt"
              receiptFile="$receiptDirectory/gc-validation-children.json"
              if [ ! -f "$statusFile" ] || [ ! -f "$receiptFile" ]; then
                echo "GC validation orchestration did not produce its required status and receipt files."
                exit 1
              fi

              orchestrationStatus="$(cat "$statusFile")"
              if ! [[ "$orchestrationStatus" =~ ^[0-9]+$ ]] || [ "$orchestrationStatus" -ne 0 ]; then
                echo "GC validation child orchestration failed. See the published child receipt artifact."
                exit 1
              fi

              python3 -c \
                "import json,sys; receipt=json.load(open(sys.argv[1], encoding='utf-8')); valid=receipt.get('allTerminalReceipts') is True and receipt.get('succeeded') is True and len(receipt.get('children', {})) == 5; sys.exit(0 if valid else 1)" \
                "$receiptFile"
            displayName: Require successful child receipts
            condition: always()
