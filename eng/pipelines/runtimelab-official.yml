parameters:
- name: publishToExperimentalFeed
  displayName: Request publication after explicit user approval
  type: boolean
  default: false
- name: standardGcArtifactProducer
  displayName: Standard-GC artifact producer mode
  type: string
  default: none
  values:
  - none
  - x64
  - full
- name: standardGcCampaignId
  displayName: Standard-GC campaign identity
  type: string
  default: ''
- name: standardGcCohortId
  displayName: Standard-GC cohort identity
  type: string
  default: ''
- name: externalRuntimeAspNetValidationBinding
  displayName: Authoritative ASP.NET validation binding path
  type: string
  default: ''

trigger: none
pr: none

variables:
- template: /eng/pipelines/common/variables.yml
  parameters:
    templatePath: 'templates-official'
- template: /eng/pipelines/helix-platforms.yml

- ${{ if and(ne(variables['System.TeamProject'], 'public'), ne(variables['Build.Reason'], 'PullRequest')) }}:
  - name: TeamName
    value: dotnet-core

extends:
  template: /eng/pipelines/common/templates/pipeline-with-resources.yml@self
  parameters:
    isOfficialBuild: true
    stages:
    - ${{ if and(ne(parameters.standardGcArtifactProducer, 'none'), or(ne(variables['Build.Reason'], 'Manual'), ne(variables['System.TeamProject'], 'internal'))) }}:
      - standardGcArtifactProducerRequiresManualInternal: error
    - ${{ if and(ne(parameters.standardGcArtifactProducer, 'none'), eq(parameters.standardGcCampaignId, '')) }}:
      - standardGcArtifactProducerRequiresCampaignId: error
    - ${{ if and(ne(parameters.standardGcArtifactProducer, 'none'), eq(parameters.standardGcCohortId, '')) }}:
      - standardGcArtifactProducerRequiresCohortId: error

    - stage: Build
      jobs:
        #
        # Build the whole product with Release CoreCLR
        #
        - template: /eng/pipelines/common/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/common/global-build-job.yml
            helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
            buildConfig: release
            platforms:
            - linux_x64
            - windows_x64
            - ${{ if eq(parameters.standardGcArtifactProducer, 'full') }}:
              - windows_x86
              - linux_arm64
              - windows_arm64
            jobParameters:
              templatePath: 'templates-official'
              isOfficialBuild: true
              enableSigning: false
              nameSuffix: coreclr
              timeoutInMinutes: 180
              # V4 Publish stages files into this build's pipeline artifact, not a package feed.
              enablePublishing: true
              publishingVersion: 4
              templateContext:
                outputs:
                - ${{ if ne(parameters.standardGcArtifactProducer, 'none') }}:
                  - output: pipelineArtifact
                    displayName: Publish standard CoreCLR archive
                    targetPath: $(Build.StagingDirectory)/StandardGcArchiveOutput/BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
                    artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
                - ${{ if eq(parameters.standardGcArtifactProducer, 'full') }}:
                  - output: pipelineArtifact
                    displayName: Publish Windows x64 dotnet layout
                    targetPath: $(Build.StagingDirectory)/ExternalDotnetLayout_windows_x64_Release_coreclr.zip
                    artifactName: ExternalDotnetLayout_windows_x64_Release_coreclr
                    condition: and(succeeded(), eq(variables['osGroup'], 'windows'), eq(variables['archType'], 'x64'))
                  - output: pipelineArtifact
                    displayName: Publish Windows ARM64 dotnet layout
                    targetPath: $(Build.StagingDirectory)/ExternalDotnetLayout_windows_arm64_Release_coreclr.zip
                    artifactName: ExternalDotnetLayout_windows_arm64_Release_coreclr
                    condition: and(succeeded(), eq(variables['osGroup'], 'windows'), eq(variables['archType'], 'arm64'))
              buildArgs: -s clr+libs+host+packs -c $(_BuildConfig) -restore -build -publish /p:PublishingVersion=4
              postBuildSteps:
              - ${{ if ne(parameters.standardGcArtifactProducer, 'none') }}:
                - template: /eng/pipelines/common/upload-artifact-step.yml
                  parameters:
                    rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                    includeRootFolder: false
                    archiveType: $(archiveType)
                    archiveExtension: $(archiveExtension)
                    tarCompression: $(tarCompression)
                    artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
                    displayName: Standard CoreCLR build assets
                    isOfficialBuild: true
                    publishArtifact: false
                - task: CopyFiles@2
                  displayName: Stage standard CoreCLR archive for publication
                  inputs:
                    SourceFolder: $(Build.StagingDirectory)
                    Contents: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr$(archiveExtension)
                    TargetFolder: $(Build.StagingDirectory)/StandardGcArchiveOutput/BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
                    CleanTargetFolder: true
                    OverWrite: false
                    flattenFolders: true
              - ${{ if eq(parameters.standardGcArtifactProducer, 'full') }}:
                - template: /eng/pipelines/runtimelab/create-dotnet-layout-step.yml
                  parameters:
                    rid: win-x64
                    artifactName: ExternalDotnetLayout_windows_x64_Release_coreclr
                    condition: and(succeeded(), eq(variables['osGroup'], 'windows'), eq(variables['archType'], 'x64'))
                - template: /eng/pipelines/runtimelab/create-dotnet-layout-step.yml
                  parameters:
                    rid: win-arm64
                    artifactName: ExternalDotnetLayout_windows_arm64_Release_coreclr
                    condition: and(succeeded(), eq(variables['osGroup'], 'windows'), eq(variables['archType'], 'arm64'))

        #
        # Build libraries AllConfigurations for packages
        #
        - template: /eng/pipelines/common/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/common/global-build-job.yml
            buildConfig: release
            platforms:
            - windows_x64
            jobParameters:
              templatePath: 'templates-official'
              # Unlike the runtime's packs subset, libraries need an explicit Pack action.
              buildArgs: -s tools+libs -c $(_BuildConfig) -restore -build -pack -publish /p:PublishingVersion=4 /p:EnableDefaultRidSpecificArtifacts=false /p:BuildAllConfigurations=true /p:TestAssemblies=false /p:TestPackages=true
              nameSuffix: Libraries_AllConfigurations
              isOfficialBuild: true
              enableSigning: false
              enablePublishing: true
              publishingVersion: 4
              timeoutInMinutes: 95

        - ${{ if eq(parameters.standardGcArtifactProducer, 'full') }}:
          - template: /eng/pipelines/runtimelab/standard-gc-artifact-producer-jobs.yml
            parameters:
              campaignId: ${{ parameters.standardGcCampaignId }}
              cohortId: ${{ parameters.standardGcCohortId }}
              aspNetValidationBinding: ${{ parameters.externalRuntimeAspNetValidationBinding }}

    - ${{ if ne(parameters.standardGcArtifactProducer, 'none') }}:
      - stage: StandardGcArtifactManifest
        displayName: Standard-GC artifact manifest
        dependsOn: Build
        condition: succeededOrFailed()
        jobs:
        - template: /eng/pipelines/runtimelab/standard-gc-manifest-job.yml
          parameters:
            campaignId: ${{ parameters.standardGcCampaignId }}
            cohortId: ${{ parameters.standardGcCohortId }}
            producerScope: ${{ parameters.standardGcArtifactProducer }}
            aspNetValidationBinding: ${{ parameters.externalRuntimeAspNetValidationBinding }}

    - ${{ if parameters.publishToExperimentalFeed }}:
      - stage: RegisterAssets
        displayName: Register build assets
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
        jobs:
        - template: /eng/common/templates-official/job/publish-build-assets.yml
          parameters:
            configuration: Release
            publishingVersion: 4
            publishAssetsImmediately: false
            isAssetlessBuild: false

      - template: /eng/common/templates-official/post-build/post-build.yml
        parameters:
          publishingInfraVersion: 4
          validateDependsOn:
          - RegisterAssets
          publishDependsOn:
          - Validate
          - RegisterAssets
          enableSigningValidation: false
          enableNugetValidation: true
          enableSourceLinkValidation: true
          requireDefaultChannels: true
          publishAssetsImmediately: false
          publishInstallersAndChecksums: true
