parameters:
- name: publishToExperimentalFeed
  displayName: Request publication after explicit user approval
  type: boolean
  default: false

trigger: none
pr: none

variables:
- template: /eng/pipelines/common/variables.yml
  parameters:
    templatePath: 'templates-official'
- template: /eng/pipelines/helix-platforms.yml

- ${{ if and(ne(variables['System.TeamProject'], 'public'), ne(variables['Build.Reason'], 'PullRequest')) }}:
  - name: TeamName
    value: dotnet-core

extends:
  template: /eng/pipelines/common/templates/pipeline-with-resources.yml@self
  parameters:
    isOfficialBuild: true
    stages:
    - stage: Build
      jobs:
        #
        # Build the whole product with Release CoreCLR
        #
        - template: /eng/pipelines/common/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/common/global-build-job.yml
            helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
            buildConfig: release
            platforms:
            - linux_x64
            - windows_x64
            jobParameters:
              templatePath: 'templates-official'
              isOfficialBuild: true
              enableSigning: false
              nameSuffix: coreclr
              timeoutInMinutes: 180
              # V4 Publish stages files into this build's pipeline artifact, not a package feed.
              enablePublishing: true
              publishingVersion: 4
              buildArgs: -s clr+libs+host+packs -c $(_BuildConfig) -restore -build -publish /p:PublishingVersion=4

        #
        # Build libraries AllConfigurations for packages
        #
        - template: /eng/pipelines/common/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/common/global-build-job.yml
            buildConfig: release
            platforms:
            - windows_x64
            jobParameters:
              templatePath: 'templates-official'
              buildArgs: -s tools+libs -allConfigurations -c $(_BuildConfig) -restore -build -publish /p:PublishingVersion=4 /p:EnableDefaultRidSpecificArtifacts=false /p:BuildAllConfigurations=true /p:TestAssemblies=false /p:TestPackages=true
              nameSuffix: Libraries_AllConfigurations
              isOfficialBuild: true
              enableSigning: false
              enablePublishing: true
              publishingVersion: 4
              timeoutInMinutes: 95

    - ${{ if parameters.publishToExperimentalFeed }}:
      - stage: RegisterAssets
        displayName: Register build assets
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
        jobs:
        - template: /eng/common/templates-official/job/publish-build-assets.yml
          parameters:
            configuration: Release
            publishingVersion: 4
            publishAssetsImmediately: false
            isAssetlessBuild: false

      - template: /eng/common/templates-official/post-build/post-build.yml
        parameters:
          publishingInfraVersion: 4
          validateDependsOn:
          - RegisterAssets
          publishDependsOn:
          - Validate
          - RegisterAssets
          enableSigningValidation: false
          enableNugetValidation: true
          enableSourceLinkValidation: true
          requireDefaultChannels: true
          publishAssetsImmediately: false
          publishInstallersAndChecksums: true
