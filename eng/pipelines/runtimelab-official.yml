parameters:
- name: publishToExperimentalFeed
  displayName: Request publication after explicit user approval
  type: boolean
  default: false
- name: gcExperimentMode
  displayName: Source-owned GC experiment mode
  type: string
  default: none
  values:
  - none
  - representative

trigger: none
pr: none

resources:
  repositories:
  - repository: performance
    type: git
    name: internal/dotnet-performance
    ref: refs/heads/main

variables:
- template: /eng/pipelines/common/variables.yml
  parameters:
    templatePath: 'templates-official'
- template: /eng/pipelines/helix-platforms.yml
- name: performanceRepositoryRef
  value: $[ resources.repositories.performance.ref ]
- name: performanceSourceVersion
  value: $[ resources.repositories.performance.version ]

- ${{ if and(ne(variables['System.TeamProject'], 'public'), ne(variables['Build.Reason'], 'PullRequest')) }}:
  - name: TeamName
    value: dotnet-core

extends:
  template: /eng/pipelines/common/templates/pipeline-with-resources.yml@self
  parameters:
    isOfficialBuild: true
    stages:
    - ${{ if and(eq(parameters.gcExperimentMode, 'representative'), or(ne(variables['Build.Reason'], 'Manual'), ne(variables['System.TeamProject'], 'internal'))) }}:
      - gcExperimentModeRepresentativeRequiresManualInternal: error

    - stage: Build
      variables:
      - ${{ if and(eq(parameters.gcExperimentMode, 'representative'), eq(variables['System.TeamProject'], 'internal')) }}:
        - group: DotNet-HelixApi-Access
      jobs:
        - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
          - template: /eng/common/core-templates/job/helix-job-monitor.yml
            parameters:
              helixAccessToken: $(HelixApiAccessToken)
              timeoutInMinutes: 720
              allowNoHelixJobs: false
              condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))

        #
        # Build the whole product with Release CoreCLR
        #
        - template: /eng/pipelines/common/platform-matrix.yml
          parameters:
            jobTemplate: /eng/pipelines/common/global-build-job.yml
            helixQueuesTemplate: /eng/pipelines/libraries/helix-queues-setup.yml
            buildConfig: release
            platforms:
            - linux_x64
            - ${{ if or(ne(parameters.gcExperimentMode, 'representative'), eq(parameters.publishToExperimentalFeed, true)) }}:
              - windows_x64
            jobParameters:
              templatePath: 'templates-official'
              isOfficialBuild: true
              enableSigning: false
              nameSuffix: coreclr
              timeoutInMinutes: 180
              # V4 Publish stages files into this build's pipeline artifact, not a package feed.
              enablePublishing: true
              publishingVersion: 4
              templateContext:
                outputs:
                - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
                  - output: pipelineArtifact
                    displayName: Publish runtime artifacts for performance
                    targetPath: $(Build.StagingDirectory)/BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr$(archiveExtension)
                    artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
                    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'), eq(variables['osGroup'], 'linux'))
                  - output: pipelineArtifact
                    displayName: Publish immutable package cohort manifest
                    targetPath: $(Build.StagingDirectory)/gc-experiment-manifest
                    artifactName: GCExperimentManifest_$(osGroup)$(osSubgroup)_$(archType)_release_runtime
                    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
              buildArgs: -s clr+libs+host+packs -c $(_BuildConfig) -restore -build -publish /p:PublishingVersion=4
              postBuildSteps:
              - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
                - template: /eng/pipelines/common/upload-artifact-step.yml
                  parameters:
                    rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                    includeRootFolder: false
                    archiveType: $(archiveType)
                    archiveExtension: $(archiveExtension)
                    tarCompression: $(tarCompression)
                    artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr
                    displayName: Runtime artifacts for performance
                    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'), eq(variables['osGroup'], 'linux'))
                    isOfficialBuild: true
                    publishArtifact: false
              - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
                - template: /eng/pipelines/runtimelab/generate-cohort-manifest-step.yml
                  parameters:
                    cohortRole: runtime
                    additionalArtifact: $(Build.StagingDirectory)/BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)_coreclr$(archiveExtension)
                    condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))

        #
        # Build libraries AllConfigurations for packages
        #
        - ${{ if or(ne(parameters.gcExperimentMode, 'representative'), eq(parameters.publishToExperimentalFeed, true)) }}:
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              buildConfig: release
              platforms:
              - windows_x64
              jobParameters:
                templatePath: 'templates-official'
                # Unlike the runtime's packs subset, libraries need an explicit Pack action.
                buildArgs: -s tools+libs -c $(_BuildConfig) -restore -build -pack -publish /p:PublishingVersion=4 /p:EnableDefaultRidSpecificArtifacts=false /p:BuildAllConfigurations=true /p:TestAssemblies=false /p:TestPackages=true
                nameSuffix: Libraries_AllConfigurations
                isOfficialBuild: true
                enableSigning: false
                enablePublishing: true
                publishingVersion: 4
                templateContext:
                  outputs:
                  - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
                    - output: pipelineArtifact
                      displayName: Publish immutable package cohort manifest
                      targetPath: $(Build.StagingDirectory)/gc-experiment-manifest
                      artifactName: GCExperimentManifest_$(osGroup)$(osSubgroup)_$(archType)_release_libraries_all_configurations
                      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
                timeoutInMinutes: 95
                postBuildSteps:
                - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
                  - template: /eng/pipelines/runtimelab/generate-cohort-manifest-step.yml
                    parameters:
                      cohortRole: libraries_all_configurations
                      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))

        #
        # Run the smallest standard CoreCLR correctness lane on Linux x64.
        #
        - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
              buildConfig: checked
              platforms:
              - linux_x64
              jobParameters:
                condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
                nameSuffix: GC_Correctness
                timeoutInMinutes: 200
                buildArgs: -s clr+libs+clr.hosts+packs -c debug -rc $(_BuildConfig)
                postBuildSteps:
                - template: /eng/pipelines/common/templates/runtimes/build-runtime-tests-and-send-to-helix.yml
                  parameters:
                    testBuildArgs: tree GC
                    scenarios:
                    - normal
                    useHelixMonitor: true
                extraVariablesTemplates:
                - template: /eng/pipelines/common/templates/runtimes/test-variables.yml
                  parameters:
                    testGroup: innerloop

        #
        # Run the standard CoreCLR GCStress plumbing on Linux x64, bounded to GCStress0xC.
        #
        - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/global-build-job.yml
              buildConfig: checked
              platforms:
              - linux_x64
              jobParameters:
                condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
                nameSuffix: GCStress
                buildArgs: -s clr+libs -c $(_BuildConfig) -lc Release
                postBuildSteps:
                - template: /eng/pipelines/coreclr/templates/build-native-test-assets-step.yml
                - template: /eng/pipelines/common/upload-artifact-step.yml
                  parameters:
                    rootFolder: $(Build.SourcesDirectory)/artifacts/bin
                    includeRootFolder: false
                    archiveType: $(archiveType)
                    archiveExtension: $(archiveExtension)
                    tarCompression: $(tarCompression)
                    artifactName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                    displayName: Build Assets
                extraVariablesTemplates:
                - template: /eng/pipelines/common/templates/runtimes/native-test-assets-variables.yml
                  parameters:
                    testGroup: gcstress0x3-gcstress0xc

          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/templates/runtimes/build-test-job.yml
              buildConfig: checked
              platforms:
              - CoreClrTestBuildHost
              jobParameters:
                condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
                testGroup: gcstress0x3-gcstress0xc

          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/common/templates/runtimes/run-test-job.yml
              buildConfig: checked
              platforms:
              - linux_x64
              helixQueueGroup: ci
              helixQueuesTemplate: /eng/pipelines/coreclr/templates/helix-queues-setup.yml
              jobParameters:
                condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
                useHelixMonitor: true
                testGroup: gcstress0x3-gcstress0xc
                gcStressScenarios:
                - gcstress0xc
                liveLibrariesBuildConfig: Release
                unifiedArtifactsName: BuildArtifacts_$(osGroup)$(osSubgroup)_$(archType)_$(_BuildConfig)
                unifiedBuildNameSuffix: GCStress

        #
        # Consume the canonical Release build in one standard dotnet/performance microbenchmark lane.
        #
        - ${{ if eq(parameters.gcExperimentMode, 'representative') }}:
          - template: /eng/pipelines/common/platform-matrix.yml
            parameters:
              jobTemplate: /eng/pipelines/templates/runtime-perf-job.yml@performance
              buildConfig: release
              runtimeFlavor: coreclr
              platforms:
              - linux_x64
              jobParameters:
                condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
                liveLibrariesBuildConfig: Release
                runKind: micro
                runCategories: Runtime
                logicalMachine: perfviper
                runtimeRepoAlias: self
                performanceRepoAlias: performance

    - ${{ if parameters.publishToExperimentalFeed }}:
      - stage: RegisterAssets
        displayName: Register build assets
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))
        jobs:
        - template: /eng/common/templates-official/job/publish-build-assets.yml
          parameters:
            configuration: Release
            publishingVersion: 4
            publishAssetsImmediately: false
            isAssetlessBuild: false

      - template: /eng/common/templates-official/post-build/post-build.yml
        parameters:
          publishingInfraVersion: 4
          validateDependsOn:
          - RegisterAssets
          publishDependsOn:
          - Validate
          - RegisterAssets
          enableSigningValidation: false
          enableNugetValidation: true
          enableSourceLinkValidation: true
          requireDefaultChannels: true
          publishAssetsImmediately: false
          publishInstallersAndChecksums: true
