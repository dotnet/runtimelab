parameters:
  variables: {}
  osGroup: ''
  platform: ''
  archType: ''
  container: ''
  pool: {}
  bindings:
    isBindingsBuild: false
    scriptArgs: ''

jobs:

- template: /eng/common/templates/jobs/jobs.yml
  parameters:
    enableTelemetry: true
    helixRepo: dotnet/runtimelab
    pool: ${{ parameters.pool }}
    enableMicrobuild: true
    graphFileGeneration:
      enabled: false
      includeToolset: false

    jobs:
    - job: ${{ format('{0}_{1}_{2}', parameters.osGroup, parameters.platform, parameters.archType) }}
      displayName: ${{ format('{0} {1} {2}', parameters.osGroup, parameters.platform, parameters.archType) }}
      strategy:
        matrix:
          Release:
            _BuildConfig: Release
          Debug:
            _BuildConfig: Debug

      steps:
      - script: |
          ./build.sh
          ./dotnet.sh workload install maui maccatalyst mobile-librarybuilder-net9 --version 10.0.100-preview.1.25124.2 --source https://api.nuget.org/v3/index.json
          ./dotnet.sh new tool-manifest && ./dotnet.sh tool install microsoft.dotnet.xharness.cli --version "10.0.0-prerelease*" && ./dotnet.sh tool install Swift.Bindings --prerelease
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
        displayName: Install dependencies

      - script: ./build.sh
                -pack
                -c $(_BuildConfig)
                /p:TargetPlatform=${{ parameters.archType }}
        displayName: Build and test

      # - script: ./generate.sh --configuration $(_BuildConfig) --platform MacOSX ${{ parameters.bindings.scriptArgs }}
      #   displayName: Generate MacOSX bindings
      # - script: ./generate.sh --configuration $(_BuildConfig) --platform iPhoneOS ${{ parameters.bindings.scriptArgs }}
      #   displayName: Generate iOS bindings
      # - script: ./generate.sh --configuration $(_BuildConfig) --platform iPhoneSimulator ${{ parameters.bindings.scriptArgs }}
      #   displayName: Generate iOSSimulator bindings
      # - script: ./generate.sh --configuration $(_BuildConfig) --platform AppleTVOS ${{ parameters.bindings.scriptArgs }}
      #   displayName: Generate tvOS bindings
      # - script: ./generate.sh --configuration $(_BuildConfig) --platform AppleTVSimulator ${{ parameters.bindings.scriptArgs }}
      #   displayName: Generate tvOSSimulator bindings
      - script: ./generate.sh --configuration $(_BuildConfig) --platform iPhoneOS --maccatalyst ${{ parameters.bindings.scriptArgs }}
        displayName: Generate MacCatalyst bindings

      - script: >-
          ./build.sh -ci
          -publish
          -pack
          -configuration Release
          --projects $(pwd)/GeneratedBindings/Swift.Bindings.MacCatalyst.Experimental.csproj
        displayName: Prepare bindings artifacts and upload to build

      - script: |
          ./dotnet.sh build ./src/Swift.Bindings/tests/FrameworkTests/Swift.Bindings.Framework.Tests.csproj \
          -f net10.0-${{ parameters.platform }} \
          -c $(_BuildConfig) \
          -r ${{ parameters.platform }}-${{ parameters.archType }} \
          /p:UseMaui=true
        displayName: Publish app

      - script: |
          cd ./src/Swift.Bindings/tests/FrameworkTests/WrapperApp
          xcodebuild -project swiftbindings.xcodeproj -scheme swiftbindings -configuration Release -destination "platform=macOS,variant=Mac Catalyst" -derivedDataPath ./MyBuild CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE="Manual" PRODUCT_BUNDLE_IDENTIFIER="com.companyname.swiftbindings" build
          open ./MyBuild/Build/Products/Release-maccatalyst/swiftbindings.app
        displayName: Build and run wrapper app

      - script: |
          ./dotnet.sh xharness apple test \
          --target ${{ parameters.platform }} \
          --timeout="00:02:00" \
          --launch-timeout=00:06:00 \
          --app ./src/Swift.Bindings/tests/FrameworkTests/bin/$(_BuildConfig)/net10.0-${{ parameters.platform }}/${{ parameters.platform }}-${{ parameters.archType }}/Swift.Bindings.Framework.Tests.app \
          --output-directory artifacts
        displayName: Run device tests
        continueOnError: true

      - script: |
          cat artifacts/Swift.Bindings.Framework.Tests.log
        displayName: Display logs
