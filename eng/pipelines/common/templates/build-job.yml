parameters:
  variables: {}
  osGroup: ''
  archType: ''
  container: ''
  pool: {}
  isOfficialBuild: false
  runTests: true
  bindings:
    isBindingsBuild: false
    scriptArgs: ''

jobs:

- template: /eng/common/templates/jobs/jobs.yml
  parameters:
    enableTelemetry: true
    helixRepo: dotnet/runtimelab
    pool: ${{ parameters.pool }}
    enableMicrobuild: true
    graphFileGeneration:
      enabled: false
      includeToolset: false

    jobs:
    - job: ${{ format('{0}_{1}', parameters.osGroup, parameters.archType) }}
      displayName: ${{ format('{0} {1}', parameters.osGroup, parameters.archType) }}
      strategy:
        matrix:
          Release:
            _BuildConfig: Release
          ${{ if eq(parameters.isOfficialBuild, false) }}:
            Debug:
              _BuildConfig: Debug

      ${{ if eq(parameters.runTests, true) }}:
        testResultsFormat: vstest
        testRunTitle: ${{ parameters.osGroup }}_${{ parameters.archType }}_$(_BuildConfig)

      variables:
        - _buildScript: build.cmd
        - ${{ if ne(parameters.osGroup, 'Windows_NT') }}:
          - _buildScript: ./build.sh

        - _testBuildArg: ''
        - ${{ if eq(parameters.runTests, true) }}:
          - _testBuildArg: -test

      steps:
      - script: $(_buildScript)
                -pack
                -c $(_BuildConfig)
                $(_testBuildArg)
                /p:TargetPlatform=${{ parameters.archType }}
        displayName: Build and Test

      - script: ./verify.sh
        displayName: Verify code formatting

      - ${{ if and(eq(parameters.bindings.isBindingsBuild, true), ne(parameters.osGroup, 'Windows_NT')) }}:
        - script: ./generate.sh --configuration $(_BuildConfig) ${{ parameters.bindings.scriptArgs }}
          displayName: Generate Bindings

      - script: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
        displayName: Select Xcode 16.2

      - script: |
          ./dotnet.sh build ./src/Swift.Bindings/tests/FrameworkTests/RunnerApp/RunnerApp.csproj \
          -f net9.0-maccatalyst \
          -c $(_BuildConfig) \
          -r maccatalyst-${{ parameters.archType }} \
          /p:UseMaui=true
        displayName: Publish app

      - script: |
          ./dotnet.sh tool install Microsoft.DotNet.XHarness.CLI \
          --global \
          --add-source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json \
          --version "10.0.0-prerelease*"
        displayName: Install XHarness

      - script: |
          /Users/runner/work/1/s/.dotnet/tools/xharness apple test \
          --target maccatalyst \
          --timeout="00:02:00" \
          --launch-timeout=00:06:00 \
          --app ./src/Swift.Bindings/tests/FrameworkTests/RunnerApp/bin/$(_BuildConfig)/net9.0-maccatalyst/maccatalyst-${{ parameters.archType }}/RunnerApp.app \
          --output-directory artifacts
        displayName: Run device tests

      - ${{ if eq(parameters.isOfficialBuild, true) }}:
        - template: /eng/pipelines/common/upload-intermediate-artifacts-step.yml
          parameters:
            name: ${{ parameters.osGroup }}${{ parameters.archType }}
            isOfficialBuild: ${{ parameters.isOfficialBuild }}
