parameters:
  osGroup: ''
  osSubgroup: ''
  archType: ''
  buildConfig: ''
  cohortRole: ''
  additionalArtifact: ''
  condition: succeeded()

steps:
- ${{ if eq(parameters.osGroup, 'windows') }}:
  - powershell: |
      py -3 eng/pipelines/runtimelab/generate_cohort_manifest.py `
        --package-root "$(Build.SourcesDirectory)/artifacts/packages/$(buildConfigUpper)" `
        --output "$(Build.StagingDirectory)/gc-experiment-manifest/manifest.json" `
        --source-repository "$(Build.Repository.Uri)" `
        --source-branch "$(Build.SourceBranch)" `
        --source-version "$(Build.SourceVersion)" `
        --performance-repository-ref "$(performanceRepositoryRef)" `
        --performance-source-version "$(performanceSourceVersion)" `
        --build-id "$(Build.BuildId)" `
        --build-number "$(Build.BuildNumber)" `
        --job-name "$(System.JobName)" `
        --build-configuration "$(buildConfigUpper)" `
        --os-group "${{ parameters.osGroup }}${{ parameters.osSubgroup }}" `
        --architecture "${{ parameters.archType }}" `
        --cohort-role "${{ parameters.cohortRole }}"
    displayName: Generate immutable package cohort manifest
    condition: ${{ parameters.condition }}

- ${{ if ne(parameters.osGroup, 'windows') }}:
  - script: |
      artifact_args=()
      if [ -n '${{ parameters.additionalArtifact }}' ]; then
        artifact_args+=(--artifact '${{ parameters.additionalArtifact }}')
      fi
      python3 eng/pipelines/runtimelab/generate_cohort_manifest.py \
        --package-root "$(Build.SourcesDirectory)/artifacts/packages/$(buildConfigUpper)" \
        --output "$(Build.StagingDirectory)/gc-experiment-manifest/manifest.json" \
        --source-repository "$(Build.Repository.Uri)" \
        --source-branch "$(Build.SourceBranch)" \
        --source-version "$(Build.SourceVersion)" \
        --performance-repository-ref "$(performanceRepositoryRef)" \
        --performance-source-version "$(performanceSourceVersion)" \
        --build-id "$(Build.BuildId)" \
        --build-number "$(Build.BuildNumber)" \
        --job-name "$(System.JobName)" \
        --build-configuration "$(buildConfigUpper)" \
        --os-group "${{ parameters.osGroup }}${{ parameters.osSubgroup }}" \
        --architecture "${{ parameters.archType }}" \
        --cohort-role "${{ parameters.cohortRole }}" \
        "${artifact_args[@]}"
    displayName: Generate immutable package cohort manifest
    condition: ${{ parameters.condition }}

- template: /eng/pipelines/common/templates/publish-pipeline-artifacts.yml
  parameters:
    isOfficialBuild: true
    displayName: Publish immutable package cohort manifest
    inputs:
      targetPath: $(Build.StagingDirectory)/gc-experiment-manifest
      artifactName: GCExperimentManifest_${{ parameters.osGroup }}${{ parameters.osSubgroup }}_${{ parameters.archType }}_${{ parameters.buildConfig }}_${{ parameters.cohortRole }}
    condition: ${{ parameters.condition }}
